<!DOCTYPE html>
<html lang="en" data-theme="white" data-accent="blue">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />

    <!-- Primary Meta Tags -->
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <title>The Archive | Event Gallery — Sandbox Réseau</title>
    <meta name="title" content="The Archive | Event Gallery — Sandbox Réseau" />
    <meta name="description"
        content="Explore snapshots from past Sandbox Réseau meetups. See the demos, the connections, and the builders shaping Accra's tech ecosystem." />
    <meta name="keywords" content="Event Gallery, Tech Meetup Photos, Accra Tech Community, Sandbox Réseau Archive" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sandboxreseau.com/gallery.html" />
    <meta property="og:title" content="The Archive | Event Gallery — Sandbox Réseau" />
    <meta property="og:description" content="Explore snapshots from past Sandbox Réseau meetups in Accra." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="The Archive | Event Gallery — Sandbox Réseau" />
    <meta property="twitter:description" content="Explore snapshots from past Sandbox Réseau meetups in Accra." />

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Libre+Baskerville:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                        serif: ['"Libre Baskerville"', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Base theme vars (Copied from index.html for consistency) */
        :root {
            --paper: #fbfaf7;
            --ink: #111;
            --muted: #5b5b5b;
            --rule: #111;
            --accent: #0ea5e9;
        }

        [data-theme="white"] {
            --paper: #fbfaf7;
            --ink: #111;
            --muted: #5b5b5b;
            --rule: #111;
        }

        [data-theme="black"] {
            --paper: #0b0b0b;
            --ink: #f3f3f3;
            --muted: #bdbdbd;
            --rule: #eaeaea;
        }

        [data-theme="yellow"] {
            --paper: #fff7cc;
            --ink: #111;
            --muted: #5b5b5b;
            --rule: #111;
        }

        /* Accent palettes */
        [data-accent="blue"] {
            --accent: #0ea5e9;
        }

        [data-accent="emerald"] {
            --accent: #10b981;
        }

        [data-accent="violet"] {
            --accent: #8b5cf6;
        }

        [data-accent="amber"] {
            --accent: #f59e0b;
        }

        [data-accent="red"] {
            --accent: #ef4444;
        }

        [data-accent="fuchsia"] {
            --accent: #d946ef;
        }

        .accent-text {
            color: var(--accent);
        }

        .accent-border {
            border-color: var(--accent);
        }

        .accent-bg {
            background: var(--accent);
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
        }

        /* Masonry Support */
        .masonry-grid {
            column-count: 1;
            column-gap: 1rem;
        }

        @media (min-width: 640px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (min-width: 1024px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
        }

        /* --- Immersive Additions --- */

        /* 1. Grain Texture */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* 2. Entrance Animation */
        .animate-enter {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            will-change: opacity, transform;
        }

        .animate-enter.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 4. Native View Transitions */
        @view-transition {
            navigation: auto;
        }
    </style>
</head>

<body class="min-h-screen font-sans antialiased pb-12">
    <!-- Grain Texture -->
    <div class="grain-overlay"></div>

    <!-- ====== Masthead (3-row layout) ====== -->
    <header class="border-b-[3px] border-[var(--rule)] border-double bg-[var(--paper)]">
        <div class="mx-auto max-w-[1100px] px-4">
            <!-- Row 1: Utility (dateline + controls) -->
            <div class="flex flex-wrap items-center justify-between gap-3 py-2 text-[13px]">
                <div class="text-[var(--muted)]">
                    <span id="dateline"></span> • Vol. 1, No. 1 • Accra
                </div>

                <div class="flex items-center gap-2">
                    <!-- Back Link -->
                    <a href="/"
                        class="inline-flex items-center gap-2 mr-4 rounded bg-[var(--ink)] px-3 py-1.5 text-xs font-bold text-[var(--paper)] uppercase tracking-wide hover:opacity-80 transition-opacity">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                            stroke="currentColor" class="h-3.5 w-3.5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                        </svg>
                        Back to Gazette
                    </a>

                    <!-- Theme cycle -->
                    <button id="themeToggle"
                        class="inline-flex items-center gap-2 rounded border border-[var(--rule)] px-2.5 py-1 text-xs font-semibold uppercase tracking-wider hover:opacity-90"
                        title="Switch theme (white → black → yellow)">
                        <span class="inline-block h-[10px] w-[10px] rounded-full bg-[var(--ink)]"></span>
                        Theme
                    </button>

                    <!-- Accent quick toggle (cycles accents) -->
                    <button id="accentToggle"
                        class="inline-flex items-center gap-2 rounded border accent-border px-2.5 py-1 text-xs font-semibold uppercase tracking-wider accent-text hover:opacity-90"
                        title="Switch accent color">
                        <span class="inline-block h-[10px] w-[10px] rounded-full"
                            style="background: var(--accent)"></span>
                        Color
                    </button>
                </div>
            </div>

            <!-- Row 2: Centered Masthead -->
            <div class="py-3">
                <h1 class="text-center font-serif text-[44px] leading-none tracking-tight sm:text-[56px]">
                    Sandbox Réseau Gazette
                </h1>
                <div class="mx-auto mt-3 h-px w-24 bg-[var(--rule)]"></div>
                <p class="mt-2 text-center font-serif  text-sm text-[var(--muted)]">
                    The Archive
                </p>
            </div>

            <!-- Row 3: Slim Actions / Swatches -->
            <div class="flex flex-col items-center gap-2 pb-4">
                <div
                    class="flex items-center gap-3 text-[11px] font-semibold tracking-[.18em] uppercase text-[var(--muted)]">
                    <span>Theme</span>
                    <div class="flex items-center gap-1">
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#fbfaf7]"
                            data-theme-swatch="white" aria-label="White theme"></button>
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#0b0b0b]"
                            data-theme-swatch="black" aria-label="Black theme"></button>
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#fff7cc]"
                            data-theme-swatch="yellow" aria-label="Yellow theme"></button>
                    </div>

                    <span class="mx-2 h-3 w-px bg-[var(--rule)]/30"></span>

                    <span>Color</span>
                    <div class="flex items-center gap-1">
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#0ea5e9]"
                            data-accent-swatch="blue" aria-label="Blue"></button>
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#10b981]"
                            data-accent-swatch="emerald" aria-label="Emerald"></button>
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#8b5cf6]"
                            data-accent-swatch="violet" aria-label="Violet"></button>
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#f59e0b]"
                            data-accent-swatch="amber" aria-label="Amber"></button>
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#ef4444]"
                            data-accent-swatch="red" aria-label="Red"></button>
                        <button class="h-[18px] w-[18px] rounded-full border border-[var(--rule)] bg-[#d946ef]"
                            data-accent-swatch="fuchsia" aria-label="Fuchsia"></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-[1100px] px-4 py-8">
        <div class="mb-8 text-center">
            <h1 class="font-serif text-4xl mb-2">The Archive</h1>
            <p class="text-[var(--muted)]">Moments from past editions.</p>
        </div>

        <!-- Masonry Grid -->
        <div id="masonry-grid" class="masonry-grid">
            <!-- Images will be injected here by script below -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t-[3px] border-[var(--rule)] border-double text-[var(--ink)]">
        <div class="mx-auto flex max-w-[1100px] flex-col md:flex-row items-center justify-between gap-6 px-4 py-8 md:py-4 text-[13px] text-neutral-600">
            <div class="order-2 md:order-1 text-center md:text-left">
                © <span id="year"></span> Sandbox Réseau • Accra
            </div>
            
            <div class="order-1 md:order-2 flex flex-wrap items-center justify-center gap-x-5 gap-y-3">
                <a href="podcast" class="hover:underline">Podcast</a>
                <span class="text-[var(--ink)] font-semibold">Gallery</span>
                <a href="editions" class="hover:underline">Editions</a>
                <a href="newsletters" class="hover:underline">Newsletters</a>
                <a href="community" class="hover:underline">Community</a>
                <a href="registry" class="hover:underline">Registry</a>
                <a href="handbook" class="hover:underline">Handbook</a>
            </div>
            
            <div class="order-3">
                <a class="underline accent-text font-bold" href="https://luma.com/sandbox-reseau" target="_blank"
                    rel="noreferrer">Register</a>
            </div>
        </div>
    </footer>


    <script src="assets/js/db.js"></script>
    <script src="assets/js/content-manager.js"></script>
    <script>
        async function initPage() {
            await DB.init();

            // Init dynamically
            ContentManager.renderGallery('masonry-grid', DB.gallery);

            // Animation Observer
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, i) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.classList.add('visible');
                        }, i * 100);
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            // Re-call observer for dynamically added items
            document.querySelectorAll('.animate-enter').forEach(el => observer.observe(el));

            // Lightbox integration
            window.GALLERY_IMAGES = DB.gallery.map(img => img.url);

            // Ensure year is dynamic
            document.getElementById('year').textContent = new Date().getFullYear();
        }

        initPage();
    </script>
    <script src="assets/js/main.js" defer></script>
</body>

</html>
